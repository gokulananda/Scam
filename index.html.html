<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 3rem;
      color: #b3003b;
      margin-bottom: 30px;
    }

    .buttons {
      position: relative;
      height: 120px;
    }

    button {
      font-size: 1.2rem;
      padding: 12px 30px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    #yesBtn {
      background-color: #ff3366;
      color: white;
    }

    /* Simple & stable: start No button 3cm (~113px) to the right */
    #noBtn {
      background-color: #ffffff;
      color: #333;
      position: relative;
      margin-left: 113px; /* ~3cm */
    }

    #tease {
      margin-top: 18px;
      font-size: 1.1rem;
      color: #7a0030;
      min-height: 1.4em;
    }

    .heart {
      display: none;
      font-size: 8rem;
      color: red;
      animation: heartbeat 1s infinite;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      25% { transform: scale(1.2); }
      50% { transform: scale(1); }
      75% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="question">Sakshiii will you be my Valentine?</h1>

    <div class="buttons" id="buttons">
      <button id="yesBtn">Yes 💖</button>
      <button id="noBtn">No 😅</button>
      <div id="tease"></div>
    </div>

    <div class="heart" id="heart">❤️</div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const heart = document.getElementById('heart');
    const buttons = document.getElementById('buttons');
    const question = document.getElementById('question');
    const tease = document.getElementById('tease');

    let speed = 0.25;
    const teasingTexts = [
      'Are you sure? 😏',
      'Think again 💕',
      'Don’t be shy 😜',
      'Come onnn 🥺',
      'You know you want to 😘'
    ];

    // Simple random move, always visible
    noBtn.addEventListener('mouseenter', () => {
      speed += 0.1;

      const maxX = window.innerWidth - noBtn.offsetWidth - 20;
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.position = 'fixed';
      noBtn.style.transition = `left ${speed}s ease, top ${speed}s ease`;
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';

      tease.textContent = teasingTexts[Math.floor(Math.random() * teasingTexts.length)];
    });

    yesBtn.addEventListener('click', () => {
      buttons.style.display = 'none';
      question.style.display = 'none';
      heart.style.display = 'block';
      launchConfetti();
    });

    function launchConfetti() {
      for (let i = 0; i < 80; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = Math.random() * window.innerWidth + 'px';
        confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 60%)`;
        confetti.style.animationDuration = 2 + Math.random() * 3 + 's';
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 5000);
      }
    }
  </script>
</body>
</html>
